<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8f7"><title>车厘子事务所 🍒</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff8f7;color:#503542;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:650px;margin:auto;padding:28px 18px 60px}header{color:#ae526f;font-size:13px;font-weight:900;letter-spacing:2px}h1{font-size:34px;margin:26px 0 4px}p{color:#9c818d}nav{display:flex;gap:8px;margin:23px 0;background:#f6e7e9;padding:6px;border-radius:17px}button{font:inherit;cursor:pointer}nav button{flex:1;border:0;border-radius:12px;padding:12px 4px;background:transparent;color:#976e7f;font-weight:750}nav button.active{background:white;color:#a33c5e;box-shadow:0 2px 12px #b983921a}section{display:none}section.active{display:block}.meta{display:flex;justify-content:space-between;color:#987582;font-size:13px;margin:18px 2px 12px}.card{width:100%;height:310px;background:transparent;border:0;perspective:1000px;text-align:center;padding:0}.inner{position:relative;height:100%;transform-style:preserve-3d;transition:transform .5s}.card.flip .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px;border-radius:26px;background:linear-gradient(135deg,#fff,#ffecea);box-shadow:0 12px 30px #bd839320;border:1px solid #f2dade;backface-visibility:hidden}.back{background:linear-gradient(135deg,#fff,#f1e9fa);transform:rotateY(180deg)}.face b{font-size:27px;overflow-wrap:anywhere}.tag{position:absolute;top:20px;font-size:12px;font-weight:800;background:#f6dfe5;border-radius:20px;padding:7px 13px;color:#ab5872}.note{position:absolute;bottom:23px;font-size:12px;color:#b4929f}.actions{display:flex;gap:12px;margin:17px 0}.btn{flex:1;background:#ad496b;color:white;border:0;border-radius:15px;padding:15px;font-weight:800}.soft{background:#f3dfe4;color:#a14867}.box{margin-top:24px;background:white;border:1px solid #f0dce1;border-radius:22px;padding:20px;box-shadow:0 6px 24px #c5919b17}h2{font-size:19px;margin:0 0 15px}.track{height:9px;background:#f4e5e9;border-radius:9px;overflow:hidden}.fill{height:100%;background:#ac506d;width:0;transition:width .3s}.small{font-size:13px;color:#9b808a}.wide{width:100%;margin-top:10px}.label{display:block;font-size:14px;font-weight:700;margin:16px 0 8px}textarea{width:100%;min-height:90px;padding:12px;border-radius:12px;border:1px solid #dfcbd2;background:#fffcfb;font:inherit;resize:vertical}textarea:focus{outline:2px solid #b6587a}.entry{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid #f3e7ea}.entry:last-child{border:0}.entry div{min-width:0;overflow-wrap:anywhere}.entry small{display:block;color:#99818c;margin-top:6px}.delete{border:0;color:#a54867;background:#fae7ec;border-radius:9px;padding:9px}.empty{text-align:center;padding:25px;color:#9c818d}footer{text-align:center;margin-top:40px;color:#b9a2aa;font-size:12px}
</style></head><body><main><header>🍒 CHERRY CARDS</header><h1>车厘子事务所</h1><p>把知识装进小卡片，每天进步一点点 ✨</p><nav><button class="active" data-page="study">📖 学习</button><button data-page="create">＋ 制卡</button><button data-page="library">🗂 卡片库</button></nav><section id="study" class="active"><div class="meta"><span id="position"></span><span id="amount"></span></div><button class="card" id="card"><div class="inner"><div class="face"><span class="tag">问题</span><b id="front"></b><span class="note">轻触翻面 ↻</span></div><div class="face back"><span class="tag">答案</span><b id="back"></b><span class="note">轻触翻回 ↻</span></div></div></button><div class="actions"><button class="btn soft" id="prev">← 上一张</button><button class="btn" id="next">下一张 →</button></div><div class="box"><h2>今日的小进度 🌷</h2><div class="track"><div class="fill" id="fill"></div></div><p class="small" id="progress"></p><button class="btn soft wide" id="random">⤨ 随机抽一张</button></div></section><section id="create"><div class="box"><h2>制作一张新卡片 ✏️</h2><label class="label" for="question">正面 · 问题或单词</label><textarea id="question" placeholder="写下想记住的问题…" maxlength="300"></textarea><label class="label" for="answer">背面 · 答案或解释</label><textarea id="answer" placeholder="写下答案…" maxlength="1000"></textarea><button class="btn wide" id="save">🍒 保存卡片</button><p class="small">目前卡片只保存在这个浏览器中，换手机或清除网站数据可能会丢失。</p></div></section><section id="library"><div class="box"><h2>我的卡片 <span id="libcount"></span></h2><div id="entries"></div></div></section><footer>Made with ♡ · 车厘子事务所</footer></main><script>
const initial=[{q:"欢迎来到车厘子事务所 🍒",a:"点击卡片翻面，开始学习吧！"},{q:"Opportunity cost 是什么？",a:"选择一项行动所放弃的最佳替代选择的价值。"}];const key="cherrycards.cards.v1";let cards;try{let saved=JSON.parse(localStorage.getItem(key));cards=Array.isArray(saved)?saved:initial}catch{cards=initial}let index=0,seen=new Set();const el=id=>document.getElementById(id);function persist(){localStorage.setItem(key,JSON.stringify(cards))}function render(){const c=cards[index];el("card").classList.remove("flip");el("card").style.display=c?"block":"none";el("front").textContent=c?.q||"";el("back").textContent=c?.a||"";el("position").textContent=c?"第 "+(index+1)+" 张":"暂无卡片";el("amount").textContent="共 "+cards.length+" 张";el("libcount").textContent="("+cards.length+")";el("progress").textContent="本次看过 "+seen.size+" / "+cards.length+" 张";el("fill").style.width=(cards.length?100*seen.size/cards.length:0)+"%";const entries=el("entries");entries.replaceChildren();if(!cards.length){const p=document.createElement("p");p.className="empty";p.textContent="这里还空着，去制作第一张卡片吧 🍒";entries.append(p)}cards.forEach((c,n)=>{const row=document.createElement("div");row.className="entry";const info=document.createElement("div");const strong=document.createElement("strong");strong.textContent=c.q;const small=document.createElement("small");small.textContent=c.a;info.append(strong,small);const del=document.createElement("button");del.className="delete";del.textContent="删除";del.onclick=()=>{if(!confirm("确定删除这张卡片？"))return;cards.splice(n,1);index=Math.min(index,Math.max(0,cards.length-1));seen=new Set();persist();render()};row.append(info,del);entries.append(row)})}function move(n){if(!cards.length)return;index=(n+cards.length)%cards.length;render()}el("card").onclick=()=>{if(!cards.length)return;el("card").classList.toggle("flip");seen.add(index);el("progress").textContent="本次看过 "+seen.size+" / "+cards.length+" 张";el("fill").style.width=100*seen.size/cards.length+"%"};el("prev").onclick=()=>move(index-1);el("next").onclick=()=>move(index+1);el("random").onclick=()=>move(Math.floor(Math.random()*cards.length));document.querySelectorAll("[data-page]").forEach(btn=>btn.onclick=()=>{document.querySelectorAll("[data-page]").forEach(x=>x.classList.toggle("active",x===btn));document.querySelectorAll("section").forEach(x=>x.classList.toggle("active",x.id===btn.dataset.page))});el("save").onclick=()=>{const q=el("question").value.trim(),a=el("answer").value.trim();if(!q||!a){alert("请填写正反两面");return}cards.push({q,a});persist();el("question").value="";el("answer").value="";index=cards.length-1;render();document.querySelector('[data-page="study"]').click()};render();
</script></body></html>
